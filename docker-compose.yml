# Build context is the repo root (not each service's folder) because both
# services depend on the packages/event-bus workspace package. Only each
# service's own folder is bind-mounted for hot reload — packages/event-bus
# is baked into the image at build time, so a change there needs
# `docker compose build <service>` to take effect, not just a save.
services:
  catalogue-service:
    build:
      context: .
      dockerfile: services/catalogue-service/Dockerfile
      target: development
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: catalogue
      EVENT_BUS: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: catalogue-service
      RABBITMQ_URL: amqp://rabbitmq:5672
      PRODUCT_TOPIC: catalogue.product
      CATEGORY_TOPIC: catalogue.category
      STORAGE_BUCKET: catalogue-media
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - ./services/catalogue-service:/repo/services/catalogue-service
      - catalogue-service-node-modules:/repo/services/catalogue-service/node_modules
    depends_on:
      - mongo
      - kafka

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
      target: development
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      EVENT_BUS: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: cart-service
      RABBITMQ_URL: amqp://rabbitmq:5672
      CART_TOPIC: cart.events
      CATALOGUE_SERVICE_URL: http://catalogue-service:3000
    volumes:
      - ./services/cart-service:/repo/services/cart-service
      - cart-service-node-modules:/repo/services/cart-service/node_modules
    depends_on:
      - redis
      - kafka
      - catalogue-service

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - '9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - kafka-data:/bitnami/kafka

  # Alternative to kafka — opt in with `docker compose --profile rabbitmq up`
  # and set EVENT_BUS=rabbitmq on whichever service(s) should use it.
  # Not started by a plain `docker compose up`.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ['rabbitmq']
    ports:
      - '5672:5672'
      - '15672:15672' # management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
  catalogue-service-node-modules:
  cart-service-node-modules:
