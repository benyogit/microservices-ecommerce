services:
  catalogue-service:
    build:
      context: services/catalogue-service
      target: development
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: catalogue
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: catalogue-service
      PRODUCT_TOPIC: catalogue.product
      CATEGORY_TOPIC: catalogue.category
      STORAGE_BUCKET: catalogue-media
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - ./services/catalogue-service:/app
      - catalogue-service-node-modules:/app/node_modules
    depends_on:
      - mongo
      - kafka

  cart-service:
    build:
      context: services/cart-service
      target: development
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: cart-service
      CART_TOPIC: cart.events
      CATALOGUE_SERVICE_URL: http://catalogue-service:3000
    volumes:
      - ./services/cart-service:/app
      - cart-service-node-modules:/app/node_modules
    depends_on:
      - redis
      - kafka
      - catalogue-service

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - '9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - kafka-data:/bitnami/kafka

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  catalogue-service-node-modules:
  cart-service-node-modules:
