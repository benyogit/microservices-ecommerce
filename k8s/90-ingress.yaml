# Kubernetes has no built-in API gateway — Ingress is just a routing spec.
# ingress-nginx (installed separately, see k8s/README.md) is the actual
# gateway implementation that reads this resource and does the routing.
#
# Path-prefixed on purpose (/catalogue/...) rather than serving
# catalogue-service at "/", so this reads the way a real gateway would once
# more services exist: /catalogue/* -> catalogue-service, /orders/* ->
# order-service, etc., all through one entrypoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogue-gateway
  namespace: catalogue
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /catalogue(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalogue-service
                port:
                  number: 3000
