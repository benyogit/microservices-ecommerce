# Kubernetes has no built-in API gateway — Ingress is just a routing spec.
# ingress-nginx (installed separately, see k8s/README.md) is the actual
# gateway implementation that reads this resource and does the routing.
#
# Path-prefixed (/catalogue/..., /cart/...) rather than serving each
# service at "/", so one entrypoint fans out to multiple backend services
# by path — the actual reason to route through a gateway instead of
# hitting each service's own port directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogue-gateway
  namespace: catalogue
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /catalogue(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalogue-service
                port:
                  number: 3000
          - path: /cart(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cart-service
                port:
                  number: 3001
