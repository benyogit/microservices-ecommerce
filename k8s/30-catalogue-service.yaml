apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue-service-config
  namespace: catalogue
data:
  PORT: "3000"
  MONGO_URI: mongodb://mongo:27017
  MONGO_DB_NAME: catalogue
  KAFKA_BROKERS: kafka:9092
  KAFKA_CLIENT_ID: catalogue-service
  PRODUCT_TOPIC: catalogue.product
  CATEGORY_TOPIC: catalogue.category
  STORAGE_BUCKET: catalogue-media
  AWS_REGION: us-east-1
---
apiVersion: v1
kind: Secret
metadata:
  name: catalogue-service-secrets
  namespace: catalogue
type: Opaque
stringData:
  # Fake local credentials, same as docker-compose.yml — S3 calls never
  # leave the machine in this local setup. Replace with a real Secret
  # (or an external-secrets/Vault integration) for anything beyond local.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-service
  namespace: catalogue
  labels:
    app: catalogue-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogue-service
  template:
    metadata:
      labels:
        app: catalogue-service
    spec:
      containers:
        - name: catalogue-service
          image: catalogue-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: catalogue-service-config
            - secretRef:
                name: catalogue-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: catalogue
spec:
  selector:
    app: catalogue-service
  ports:
    - port: 3000
      targetPort: 3000
